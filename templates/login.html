{% extends "base.html" %}{% block title %}Вход в кабинет{% endblock %}{% block head %}<link rel="stylesheet" href="/assets/admin.css"><link rel="manifest" href="/assets/master.webmanifest"><link rel="apple-touch-icon" href="/assets/icon-192.png"><script defer src="/assets/device.js"></script>{% endblock %}{% block content %}<div class="master-login"><h1>Кабинет мастера</h1><form id="login"><label>Пароль<input type="password" id="password" autocomplete="current-password" required></label><button>Войти</button><p id="error" role="alert"></p></form></div><script>login.onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok)location.reload();else error.textContent=(await r.json()).detail}catch{error.textContent='Проверьте подключение'}}</script>{% endblock %}
